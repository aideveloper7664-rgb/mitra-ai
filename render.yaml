services:
  - type: web
    name: mitra-ai
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
      - key: PANEL_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: BOT_NAME
        value: Mitra AI
      - key: SIR_NAME
        value: Tech Bhai
